<aside class="sidebar">
  <header class="sidebar-brand">
    <div>
      <h2>{{ 'ADMIN.NAVBAR.BRAND' | translate }}</h2>
      <p>{{ 'ADMIN.NAVBAR.PANEL' | translate }}</p>
    </div>
  </header>

  <nav aria-label="Navegacion principal" class="sidebar-nav">
    <ul>
      <li *ngFor="let item of navItems">
        <a
          *ngIf="!item.disabled; else disabledItem"
          [routerLink]="item.href"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <span class="nav-icon {{ item.icon }}"></span>
          {{ item.labelKey | translate }}
        </a>
        <ng-template #disabledItem>
          <span class="is-disabled">
            <span class="nav-icon {{ item.icon }}"></span>
            {{ item.labelKey | translate }}
          </span>
        </ng-template>
      </li>
    </ul>
  </nav>

  <div class="sidebar-language">
    <button type="button" class="lang-toggle" (click)="toggleMenu()">
      🌐 {{ idiomaLabel }}
    </button>
    <div class="lang-menu" [class.open]="menuAbierto">
      <button
        *ngFor="let idioma of idiomas"
        type="button"
        (click)="cambiarIdioma(idioma.value)"
        [class.active]="idiomaActual === idioma.value"
      >
        {{ idioma.label }}
      </button>
    </div>
  </div>

  <footer class="sidebar-footer">
    <p>{{ 'ADMIN.NAVBAR.SESSION_ACTIVE' | translate }}</p>
    <strong>{{ 'ADMIN.NAVBAR.ADMINISTRATOR' | translate }}</strong>
    <button type="button" (click)="onSignOut()">{{ 'ADMIN.NAVBAR.LOGOUT' | translate }}</button>
  </footer>
</aside>
