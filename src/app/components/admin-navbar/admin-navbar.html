<aside class="sidebar">
  <header class="sidebar-brand">
    <h2>PuntoVenta</h2>
    <p>Panel Administrador</p>
  </header>

  <nav aria-label="Navegacion principal" class="sidebar-nav">
    <ul>
      <li *ngFor="let item of navItems">
        <a
          *ngIf="!item.disabled; else disabledItem"
          [routerLink]="item.href"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          >{{ item.label }}</a
        >
        <ng-template #disabledItem>
          <span class="is-disabled">{{ item.label }}</span>
        </ng-template>
      </li>
    </ul>
  </nav>

  <footer class="sidebar-footer">
    <p>Sesion activa</p>
    <strong>Administrador</strong>
    <button type="button" (click)="onSignOut()">Cerrar Sesion</button>
  </footer>
</aside>
