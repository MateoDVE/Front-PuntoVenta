<div class="lang-switcher">
        <button class="lang-toggle" (click)="toggleMenu()">🌐 {{ idiomaActual === 'es' ? 'Español' : idiomaActual === 'en' ? 'English' : 'Quechua' }}</button>
        <div class="lang-menu" [class.open]="menuAbierto">
            <button (click)="cambiarIdioma('es')" [class.active]="idiomaActual === 'es'">🇧🇴 Español</button>
            <button (click)="cambiarIdioma('en')" [class.active]="idiomaActual === 'en'">🇺🇸 English</button>
            <button (click)="cambiarIdioma('qu')" [class.active]="idiomaActual === 'qu'">🌿 Quechua</button>
        </div>
    </div>
<section>

    <div class="container">
        <img src="logo.png" alt="logo">
        <p>{{ 'LOGIN.TITULO_SISTEMA' | translate }}</p>        
        
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <label for="email">{{ 'LOGIN.EMAIL' | translate }}</label>
            <input 
                type="email" 
                id="email" 
                formControlName="email" 
                [placeholder]="'LOGIN.PLACEHOLDER_EMAIL' | translate" 
                required>
            
            <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error">
                {{ 'LOGIN.ERROR_EMAIL' | translate }}
            </div>

            <label for="password">{{ 'LOGIN.PASSWORD' | translate }}</label>
            <input 
                type="password" 
                id="password" 
                formControlName="password" 
                [placeholder]="'LOGIN.PLACEHOLDER_PASSWORD' | translate" 
                required>
            
            <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error">
                {{ 'LOGIN.ERROR_PASSWORD' | translate }}
            </div>

            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>

            <button type="submit" [disabled]="loginForm.invalid || loading">
                {{ loading ? ('LOGIN.CARGANDO' | translate) : ('LOGIN.BOTON_INICIAR' | translate) }}
            </button>
        </form>
    </div>
</section>
